services:
  - type: web
    name: krt-ai-terminal
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SMARTAPI_KEY
        sync: false
      - key: SMARTAPI_CLIENT
        sync: false
      - key: SMARTAPI_PIN
        sync: false
      - key: SMARTAPI_TOTP
        sync: false
